name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test storage, guidance and Git updater
        shell: powershell
        run: .\tests\Run-Tests.ps1
      - name: Test isolated development install, update and start
        shell: powershell
        run: .\tests\Run-DevelopLauncherTests.ps1
      - name: Build the Windows Forms interface
        shell: powershell
        run: .\scripts\Start-Diagnostics.ps1 -SmokeTest
      - name: Exercise the unified five-step workflow
        shell: powershell
        run: .\scripts\Start-Diagnostics.ps1 -SmokeTest -ExerciseUxWorkflow
      - name: Test evidence bundles, timeline and trace failure handling
        shell: powershell
        run: .\tests\Run-DataTests.ps1
      - name: Test trace IPC, playback warnings and concurrent phone connections
        shell: powershell
        run: .\tests\Run-IntegrationTests.ps1
      - name: Test indexed reference and bounded USB traces
        shell: powershell
        run: .\tests\Run-FollowUpTests.ps1
      - name: Test USB selection, capture absence, cancellation and artifact truth
        shell: powershell
        run: .\tests\Run-UsbReadinessTests.ps1
      - name: Test native Logman direct-session argument and file contract
        shell: powershell
        run: .\tests\Run-LogmanContractTests.ps1
      - name: Test deep capture evidence, reference comparison and partial failures
        shell: powershell
        run: .\tests\Run-InvestigationTests.ps1
      - name: Exercise linked follow-up recording and USB capture
        shell: powershell
        run: .\scripts\Start-Diagnostics.ps1 -SmokeTest -ExerciseFollowUpWorkflow
      - name: Exercise WPR stop and save state transitions
        shell: powershell
        run: .\scripts\Start-Diagnostics.ps1 -SmokeTest -ExerciseTraceWorkflow
      - name: Exercise ZIP export in the interface
        shell: powershell
        run: .\scripts\Start-Diagnostics.ps1 -SmokeTest -ExerciseExportWorkflow
      - name: Exercise phone reception and listening steps
        shell: powershell
        run: .\scripts\Start-Diagnostics.ps1 -SmokeTest -ExercisePhoneWorkflow
      - name: Set up Node for browser checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run local browser integration
        shell: powershell
        run: node .\tests\test-phone-browser.mjs
