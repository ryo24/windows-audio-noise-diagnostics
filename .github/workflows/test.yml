name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test storage, guidance and Git updater
        shell: powershell
        run: .\tests\Run-Tests.ps1
      - name: Build the Windows Forms interface
        shell: powershell
        run: .\scripts\Start-Diagnostics.ps1 -SmokeTest
